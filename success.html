<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Successful | AI Market</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .success-box {
      background: white;
      max-width: 500px;
      width: 100%;
      text-align: center;
      padding: 45px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .checkmark {
      width: 90px;
      height: 90px;
      background: #22c55e;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin: 0 auto 25px;
    }

    h1 {
      color: #111827;
      margin-bottom: 15px;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .order-box {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
      color: #16a34a;
      margin-top: 8px;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 28px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <div class="success-box">

    <div class="checkmark">✓</div>

    <h1>Payment Successful!</h1>

    <p>Thank you for purchasing from <b>AI Market</b>.</p>

    <div class="order-box">
      <p>Your AI prompt is ready.</p>
      <div class="amount">₹9 Paid</div>
    </div>

    <p>You can now access your purchased AI prompt.</p>

    <a href="index.html" class="btn">
      Back to AI Market
    </a>

  </div>

</body>
</html>
